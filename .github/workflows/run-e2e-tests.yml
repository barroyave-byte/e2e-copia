name: Run i-hub E2E tests

# Dispatched only by integration-hub (POST /e2e/runs). run-name MUST equal run_id:
# the hub finds the GitHub run by that title.
run-name: ${{ inputs.run_id }}

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "i-hub run id"
        required: true
        type: string
      test_ids:
        description: "Comma-separated Zephyr ids, e.g. PF-T127,PI-T1911"
        required: true
        type: string
      environment:
        description: "development | staging | sandbox | production"
        required: true
        type: string
      credentials_url:
        description: "One-shot endpoint that returns the run credentials"
        required: true
        type: string
      run_token:
        description: "Per-run token for credentials_url and callback_url"
        required: true
        type: string
      callback_url:
        description: "Optional: URL that receives the run summary when it ends"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: ihub-e2e-${{ inputs.run_id }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Inputs go through env, never interpolated into shell code.
      TEST_IDS: ${{ inputs.test_ids }}
      IHUB_ENVIRONMENT: ${{ inputs.environment }}
      CREDENTIALS_URL: ${{ inputs.credentials_url }}
      CALLBACK_URL: ${{ inputs.callback_url }}
      RUN_TOKEN: ${{ inputs.run_token }}
      RUN_ID: ${{ inputs.run_id }}
    steps:
      - name: Mask run token
        run: echo "::add-mask::${RUN_TOKEN}"

      - name: Validate inputs
        run: |
          [[ "$TEST_IDS" =~ ^[A-Za-z0-9_-]+(,[A-Za-z0-9_-]+)*$ ]] || { echo "invalid test_ids"; exit 1; }
          [[ "$IHUB_ENVIRONMENT" =~ ^(development|staging|sandbox|production)$ ]] || { echo "invalid environment"; exit 1; }
          [[ "$CREDENTIALS_URL" =~ ^https:// ]] || { echo "credentials_url must be https"; exit 1; }

      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Fetch run credentials (single use)
        run: |
          file="${RUNNER_TEMP}/ihub-credentials.json"
          umask 077
          code=$(curl -sS -o "$file" -w '%{http_code}' -H "X-Run-Token: ${RUN_TOKEN}" "$CREDENTIALS_URL")
          [ "$code" = "200" ] || { echo "credentials fetch failed (HTTP $code)"; rm -f "$file"; exit 1; }
          jq -e '.credentials | type == "object"' "$file" >/dev/null 2>&1 \
            || { echo "credentials response is not JSON with a .credentials object (HTTP 200, $(wc -c < "$file") bytes)"; rm -f "$file"; exit 1; }
          # Mask every credential value so it never shows up in logs.
          jq -r '.credentials[]? | .[]?' "$file" | while IFS= read -r v; do [ -n "$v" ] && echo "::add-mask::$v"; done
          echo "IHUB_CREDENTIALS_FILE=$file" >> "$GITHUB_ENV"

      # TEMPORARY DEBUG - remove once the flow is verified.
      # Shows the shape of what arrived (ids, key names, value lengths). Values stay masked on purpose.
      - name: DEBUG credentials received
        run: |
          echo "file size (bytes): $(wc -c < "$IHUB_CREDENTIALS_FILE")"
          echo "top-level keys: $(jq -c 'keys' "$IHUB_CREDENTIALS_FILE")"
          echo "test ids with credentials: $(jq -c '.credentials | keys' "$IHUB_CREDENTIALS_FILE")"
          jq -c '.credentials | to_entries[] | {test: .key, keys: (.value | keys), value_lengths: (.value | map_values(tostring | length))}' "$IHUB_CREDENTIALS_FILE"

      - name: Run tests
        id: tests
        continue-on-error: true
        env:
          CI: "true"
          PW_ARGS: ${{ vars.IHUB_PLAYWRIGHT_ARGS || '--project=chromium' }}
          PLAYWRIGHT_JSON_OUTPUT_NAME: playwright-report/results.json
        run: |
          mkdir -p playwright-report
          # Zephyr ids appear in the title (@PF-T127 ...): match any requested id as a whole word.
          grep_re="(^|\\s)@($(echo "$TEST_IDS" | tr ',' '|'))(\\s|\$)"
          # TEMPORARY DEBUG - remove once the flow is verified.
          echo "PW_ARGS=[$PW_ARGS]"
          echo "grep_re=[$grep_re]"
          echo "credentials file exists: $([ -f "$IHUB_CREDENTIALS_FILE" ] && echo yes || echo no)"
          npx playwright test $PW_ARGS --grep "$grep_re" --list
          # PW_ARGS comes from the repo variable IHUB_PLAYWRIGHT_ARGS (trusted, set by repo admins).
          npx playwright test $PW_ARGS --grep "$grep_re" --reporter=list,json
        # NOTE: how the suite picks the target environment (NODE_ENV / base URLs) is still to be
        # confirmed against playwright.config.ts; IHUB_ENVIRONMENT is exported for credentials.ts.

      - name: Delete credentials
        if: always()
        run: rm -f "${IHUB_CREDENTIALS_FILE:-/dev/null}"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ihub-e2e-${{ inputs.run_id }}
          path: playwright-report
          retention-days: 7
          if-no-files-found: ignore

      - name: Build results summary
        if: always()
        run: |
          out="${RUNNER_TEMP}/ihub-results.json"
          if [ -f playwright-report/results.json ]; then
            jq -c '[.. | objects | select(has("specs")) | .specs[] | {
                id: ((.title | capture("^@(?<id>[A-Za-z0-9]+-T[0-9]+)")? // {id:""}).id),
                title: .title,
                status: (.tests[0].results | last | .status),
                duration_ms: (.tests[0].results | last | .duration),
                credentials_fingerprint: ((.tests[0].annotations // []) | map(select(.type=="credentials-fingerprint")) | (.[0].description // ""))
              }]' playwright-report/results.json > "$out"
          else
            echo '[]' > "$out"
          fi
          echo "IHUB_RESULTS_FILE=$out" >> "$GITHUB_ENV"
          # TEMPORARY DEBUG - remove once the flow is verified. Fingerprints are short digests, never values.
          echo "per-test results:"; jq -c '.[]' "$out"
          echo "tests: $(jq 'length' "$out"), distinct credential fingerprints: $(jq '[.[].credentials_fingerprint | select(. != "")] | unique | length' "$out")"

      - name: Send summary (optional)
        if: always() && env.CALLBACK_URL != ''
        run: |
          jq -n --arg outcome "${{ steps.tests.outcome }}" --arg github_run "${{ github.run_id }}" \
            --slurpfile tests "$IHUB_RESULTS_FILE" \
            '{outcome:$outcome, github_run_id:$github_run, tests:$tests[0]}' > "${RUNNER_TEMP}/ihub-callback.json"
          echo "callback payload (no credential values):"; cat "${RUNNER_TEMP}/ihub-callback.json"
          code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST -H "Content-Type: application/json" \
                  -H "X-Run-Token: ${RUN_TOKEN}" --data @"${RUNNER_TEMP}/ihub-callback.json" "$CALLBACK_URL") || code="curl-error"
          echo "callback HTTP status: $code"

      - name: Fail the run if tests failed
        if: steps.tests.outcome == 'failure'
        run: exit 1
