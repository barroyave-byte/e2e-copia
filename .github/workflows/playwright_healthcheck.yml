name: Playwright Healthcheck Tests
on:
  pull_request:
    branches: [develop, master]
jobs:
  test:
    timeout-minutes: 60
    runs-on: gha-runner-e2e
    env:
      BASE_URL_POSTMAN: ${{ secrets.BASE_URL_POSTMAN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # The DSL action union is generated from the plugins. If a plugin changed without
      # regenerating, the committed types are stale and specs would typecheck against a
      # contract that no longer exists.
      - name: Validate generated DSL action types are up to date
        run: |
          npm run generate-action-types
          git diff --exit-code playwright/framework/generated/

      - name: Validate TypeScript Compilation
        run: npx tsc --noEmit

      # Incremental `strict` gate. Fails only on directories listed in STRICT_PATHS
      # (scripts/typecheck-strict.js), which grows one migrated directory at a time.
      - name: Validate strict TypeScript (migrated paths)
        run: npm run typecheck:strict

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        run: CI=false npx playwright test --grep @healthcheck --project=chromium --workers 2

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
