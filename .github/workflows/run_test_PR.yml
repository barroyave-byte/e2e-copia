name: Run test cases added in PR opened
on:
  pull_request:
    branches: [develop]

jobs:
  test:
    timeout-minutes: 60
    runs-on: gha-runner-e2e
    env:
      NODE_ENV: 'staging'
      STATSIG_API_KEY: ${{ secrets.STATSIG_API_KEY }}
      STATSIG_ADMIN_API_KEY: ${{ secrets.STATSIG_ADMIN_API_KEY }}
      STATSIG_FRAUD_API_KEY: ${{ secrets.STATSIG_FRAUD_API_KEY }}
      STATSIG_PAYMENTS_API_KEY: ${{ secrets.STATSIG_PAYMENTS_API_KEY }}
      MAILSLURP_API_KEY: ${{ secrets.MAILSLURP_API_KEY }}
      METABASE_PASSWORD: ${{ secrets.METABASE_PASSWORD }}
      METABASE_USER: ${{ secrets.METABASE_USER }}
      MB_USER: ${{ secrets.METABASE_USER }}
      MB_PASSWORD: ${{ secrets.METABASE_PASSWORD }}

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Identify added test cases
        run: |
          FILES=$(git diff --name-only --diff-filter=A ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }} | grep -E '\.spec\.ts$' || echo "")
          TEST_CASE_IDS=""
          if [ -z "$FILES" ]; then
            echo "No spec files identified. There are no new test cases to process."
            echo "ids=" >> $GITHUB_ENV
          else
            for FILE in $FILES; do
              TEST_CASE_ID="\"$(basename $FILE)\""
              TEST_CASE_IDS="$TEST_CASE_IDS$TEST_CASE_ID "
            done
            echo "ids=${TEST_CASE_IDS% }" >> $GITHUB_ENV
            echo "Identified Test Case IDs: ${TEST_CASE_IDS% }"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        if: env.ids != ''
        run: npm ci --no-audit --no-fund

      - name: Install Playwright Browsers
        if: env.ids != ''
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        if: env.ids != ''
        run: |
          if [ -n "${{ env.ids }}" ]; then
            CI=false npx playwright test ${{ env.ids }} --retries 1 --project=chromium --repeat-each 3
          else
            echo "No test cases to run."
          fi

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
