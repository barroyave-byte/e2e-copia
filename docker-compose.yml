version: '3'

services:
  e2e-testing:
    build:
      context: ./
      dockerfile: Dockerfile
    container_name: deuna-e2e-testing
    environment:
      - PLAYWRIGHT_ENV="staging"
    ports:
      - "3065:3065"
    volumes:
      - ./:/app
    networks:
      - deuna-network

networks:
  deuna-network:
    external: true
    name: deuna-network
